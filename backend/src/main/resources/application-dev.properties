# =========================================
# PROFIL DEV — SMTP Mailpit
# =========================================

# Mailpit tourne dans Docker, sur le reseau commun.
# HOST = nom du service docker (pas localhost !)
spring.mail.host=mailpit
spring.mail.port=1025
spring.mail.username=
spring.mail.password=

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Scheduler accelere pour tester sans attendre 5 min
app.notification.email-dispatch-enabled=true
app.notification.email-dispatch-initial-delay-ms=10000
app.notification.email-dispatch-interval-ms=30000