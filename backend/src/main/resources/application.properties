spring.application.name=backend

# =========================================
# PostgreSQL
# =========================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sagadb}
spring.datasource.username=${DB_USERNAME:saga_user}
spring.datasource.password=${DB_PASSWORD:saga_pwd}

# =========================================
# JPA / Hibernate
# =========================================

# Hibernate vérifie uniquement que les tables
# correspondent aux entités Java.
# Il ne crée/modifie/supprime aucune table.
# spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================================
# INITIALISATION SQL
# =========================================

# Les tables et les données sont gérées
# directement par PostgreSQL via Docker.
spring.sql.init.mode=never

# =========================================
# DEPOT DE FICHIERS (LIVRABLES)
# =========================================

# Racine des depots. La valeur par defaut du code est la meme : celle du jeu
# de donnees, qui ecrit deja sous /data/saga/livrables. Reprendre le meme
# repertoire fait qu un fichier televerse et un fichier du jeu de donnees se
# lisent par le meme chemin, et qu un volume monte sur ce repertoire retrouve
# les deux. Surchargeable pour un poste de developpement, ou ce chemin n est ni
# accessible ni desirable.
#
# app.depot.livrables=/data/saga/livrables

# Plafond d un fichier. 10 Mo : au-dela du raisonnable pour une piece jointe
# de suivi, et assez large pour un plan, un rapport ou un tableur.
#
# DOIT EGALEMENT VAILIR app.depot.livrables.taille-max, que le service relit :
# la propriete Spring protege avant que l octet n entre en memoire, celle du
# service ferme le trou si celle-la est relachee. Les deux valeurs sont donc
# repetees ici volontairement.
spring.servlet.multipart.max-file-size=10MB
app.depot.livrables.taille-max=10485760

# Taille maximale de la requete entière : la somme de tous les fichiers joints
# et de leurs en-tetes multipart. 10 fichiers a 10 Mo ne passent pas, et c est
# voulu -- un lot unique de cette taille n'est pas un depot de suivi.
spring.servlet.multipart.max-request-size=25MB

# Nombre de fichiers acceptes pour un livrable.
app.depot.livrables.nombre-max=10

# =========================================
# EMAIL - SMTP GMAIL
# =========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.frontend.url=http://localhost:5173

