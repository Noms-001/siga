
services:

  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: saga-postgres:dev
    container_name: saga-postgres-dev
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Indian/Antananarivo

    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB}
      - -c
      - cron.timezone=Indian/Antananarivo
      - -c
      - timezone=Indian/Antananarivo

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_dev_data:/var/lib/postgresql
      - ./database/script/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/script/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ./database/script/trigger.sql:/docker-entrypoint-initdb.d/03-trigger.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - saga-dev-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: saga-backend:dev
    container_name: saga-backend-dev
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      SPRING_PROFILES_ACTIVE: dev
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    volumes:
      - ./backend:/app
      - backend_maven_cache:/root/.m2

    command:
      - ./mvnw
      - spring-boot:run
      - -Dspring-boot.run.fork=false

    networks:
      - saga-dev-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: saga-frontend:dev
    container_name: saga-frontend-dev
    restart: unless-stopped

    depends_on:
      - backend

    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"

    ports:
      - "${FRONTEND_PORT:-5173}:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0

    networks:
      - saga-dev-network


volumes:
  postgres_dev_data:
  backend_maven_cache:
  frontend_node_modules:


networks:
  saga-dev-network:
    driver: bridge
