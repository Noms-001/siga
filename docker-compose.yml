services:

  postgres:
    image: postgres:18.4
    container_name: saga-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/script/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/script/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - saga-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: saga-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

    ports:
      - "${BACKEND_PORT}:8080"

    networks:
      - saga-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: saga-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "${FRONTEND_PORT}:80"

    networks:
      - saga-network


volumes:
  postgres_data:


networks:
  saga-network:
    driver: bridge